<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yuta Hashtag Picker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-panel" aria-labelledby="app-title">
        <div class="heading">
          <h1 id="app-title">Yuta Hashtag Picker</h1>
          <p class="intro">Macの投稿作業の横に置く、静かなタグ補助ツール。</p>
        </div>

        <form class="controls" id="hashtag-form">
          <label>
            <span>Genre</span>
            <select id="genre" name="genre"></select>
          </label>

          <label>
            <span>Subject</span>
            <select id="subject" name="subject"></select>
          </label>

          <label>
            <span>Mood</span>
            <select id="mood" name="mood"></select>
          </label>

          <label>
            <span>Purpose</span>
            <select id="purpose" name="purpose"></select>
          </label>
        </form>

        <section class="output-panel" aria-live="polite">
          <div>
            <p class="output-label">Hashtags</p>
            <textarea
              id="hashtag-output"
              class="hashtag-output"
              rows="4"
              readonly
              aria-label="生成されたハッシュタグ"
            ></textarea>
          </div>
          <div class="output-actions">
            <button type="button" id="copy-button">コピー</button>
            <button type="button" class="secondary-button" id="regenerate-button">
              再生成
            </button>
          </div>
        </section>

        <details class="translation-panel">
          <summary class="translation-summary" id="translation-title">日本語訳を見る</summary>
          <ul id="translation-list" class="translation-list"></ul>
        </details>

        <p id="copy-status" class="copy-status" role="status"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
